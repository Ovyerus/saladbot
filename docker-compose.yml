services:
  salad_psql:
    image: "postgres:17-alpine"
    restart: "unless-stopped"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "salad_psql:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: salad
      POSTGRES_USER: salad
      POSTGRES_DB: salad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: "5s"
      timeout: "5s"
      retries: 5

volumes:
  salad_psql:
